<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#071426"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#00E5FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes radarSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulseRing {
        0%, 100% { opacity: 0.25; r: 70px; }
        50% { opacity: 0.9; r: 85px; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.15; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      .radar-sweep {
        transform-origin: 150px 140px;
        animation: radarSpin 3s linear infinite;
      }
      .pulse-circle {
        animation: pulseRing 2.5s ease-in-out infinite;
      }
      .blinker {
        animation: blink 1.2s ease-in-out infinite;
      }
      .hud-line {
        stroke-dasharray: 8 6;
        animation: dashMove 1.5s linear infinite;
      }
      .mono-text {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        fill: #C9F7FF;
      }
    </style>
  </defs>

  <rect width="900" height="280" rx="16" fill="url(#bgGrad)" stroke="#082F49" stroke-width="1.5"/>

  <g opacity="0.08" stroke="#00E5FF" stroke-width="1">
    <line x1="0" y1="70" x2="900" y2="70"/>
    <line x1="0" y1="140" x2="900" y2="140"/>
    <line x1="0" y1="210" x2="900" y2="210"/>
    <line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="600" y1="0" x2="600" y2="280"/>
  </g>

  <!-- RADAR SECTION -->
  <g>
    <circle cx="150" cy="140" r="90" fill="none" stroke="#082F49" stroke-width="1.5"/>
    <circle cx="150" cy="140" r="65" fill="none" stroke="#082F49" stroke-width="1.5"/>
    <circle cx="150" cy="140" r="40" fill="none" stroke="#082F49" stroke-width="1.5"/>
    <circle cx="150" cy="140" r="15" fill="none" stroke="#00E5FF" stroke-width="1.5"/>
    <circle cx="150" cy="140" r="85" fill="none" stroke="#00E5FF" stroke-width="1.5" class="pulse-circle" opacity="0.4"/>

    <line x1="45" y1="140" x2="255" y2="140" stroke="#00E5FF" stroke-width="1" opacity="0.3"/>
    <line x1="150" y1="35" x2="150" y2="245" stroke="#00E5FF" stroke-width="1" opacity="0.3"/>

    <g class="radar-sweep">
      <path d="M 150 140 L 240 140 A 90 90 0 0 0 213 76 Z" fill="url(#radarSweep)"/>
      <line x1="150" y1="140" x2="240" y2="140" stroke="#00E5FF" stroke-width="2" filter="url(#glow)"/>
    </g>

    <circle cx="190" cy="105" r="4.5" fill="#00E5FF" filter="url(#glow)" class="blinker"/>
    <circle cx="115" cy="175" r="4" fill="#7C3AED" filter="url(#glow)" class="blinker" style="animation-delay: 0.6s"/>
    <circle cx="180" cy="180" r="4" fill="#F97316" filter="url(#glow)" class="blinker" style="animation-delay: 0.3s"/>

    <text x="150" y="255" text-anchor="middle" class="mono-text" font-size="11" fill="#00E5FF" letter-spacing="2">THREAT RADAR // SCANNING</text>
  </g>

  <!-- TELEMETRY & OPERATIONS -->
  <g transform="translate(320, 30)">
    <rect x="0" y="5" width="240" height="26" rx="6" fill="#071426" stroke="#00E5FF" stroke-width="1"/>
    <circle cx="14" cy="18" r="4" fill="#00E5FF" class="blinker"/>
    <text x="26" y="22" class="mono-text" font-size="11" font-weight="bold" fill="#00E5FF">FORENSIC TELEMETRY ENGINE</text>

    <path d="M 250 18 L 360 18 L 360 50 L 530 50" fill="none" stroke="#7C3AED" stroke-width="1.5" class="hud-line"/>

    <g transform="translate(0, 48)">
      <!-- Box 1 -->
      <rect x="0" y="0" width="250" height="42" rx="8" fill="#071426" stroke="#082F49" stroke-width="1"/>
      <text x="14" y="18" class="mono-text" font-size="11" font-weight="bold" fill="#00E5FF">⚡ TRACE-X FORENSICS</text>
      <text x="14" y="32" class="mono-text" font-size="10" fill="#64748B">BLOCKCHAIN GRAPH TRACKER</text>
      <rect x="180" y="10" width="56" height="20" rx="4" fill="#00E5FF" opacity="0.15"/>
      <text x="208" y="24" text-anchor="middle" class="mono-text" font-size="9" font-weight="bold" fill="#00E5FF">ACTIVE</text>

      <!-- Box 2 -->
      <rect x="0" y="50" width="250" height="42" rx="8" fill="#071426" stroke="#082F49" stroke-width="1"/>
      <text x="14" y="68" class="mono-text" font-size="11" font-weight="bold" fill="#7C3AED">🧠 AI CRIMINAL NETWORK</text>
      <text x="14" y="82" class="mono-text" font-size="10" fill="#64748B">NEO4J ENTITY RESOLUTION</text>
      <rect x="180" y="60" width="56" height="20" rx="4" fill="#7C3AED" opacity="0.15"/>
      <text x="208" y="74" text-anchor="middle" class="mono-text" font-size="9" font-weight="bold" fill="#7C3AED">ONLINE</text>

      <!-- Box 3 -->
      <rect x="0" y="100" width="250" height="42" rx="8" fill="#071426" stroke="#082F49" stroke-width="1"/>
      <text x="14" y="118" class="mono-text" font-size="11" font-weight="bold" fill="#F97316">🕸️ ONION RECON SCANNER</text>
      <text x="14" y="132" class="mono-text" font-size="10" fill="#64748B">DARKWEB THREAT INTEL</text>
      <rect x="180" y="110" width="56" height="20" rx="4" fill="#F97316" opacity="0.15"/>
      <text x="208" y="124" text-anchor="middle" class="mono-text" font-size="9" font-weight="bold" fill="#F97316">SCOUT</text>
    </g>

    <!-- Gauge Panel -->
    <g transform="translate(270, 48)">
      <rect x="0" y="0" width="270" height="142" rx="8" fill="#071426" stroke="#082F49" stroke-width="1"/>
      <text x="14" y="24" class="mono-text" font-size="11" font-weight="bold" fill="#00E5FF">INVESTIGATIVE READINESS</text>

      <text x="14" y="50" class="mono-text" font-size="10" fill="#94A3B8">DIGITAL FORENSICS (DFIR)</text>
      <rect x="14" y="56" width="242" height="6" rx="3" fill="#082F49"/>
      <rect x="14" y="56" width="225" height="6" rx="3" fill="#00E5FF" filter="url(#glow)"/>

      <text x="14" y="82" class="mono-text" font-size="10" fill="#94A3B8">OSINT &amp; CYBERSECURITY</text>
      <rect x="14" y="88" width="242" height="6" rx="3" fill="#082F49"/>
      <rect x="14" y="88" width="205" height="6" rx="3" fill="#7C3AED" filter="url(#glow)"/>

      <text x="14" y="114" class="mono-text" font-size="10" fill="#94A3B8">AI &amp; GRAPH INTEL</text>
      <rect x="14" y="120" width="242" height="6" rx="3" fill="#082F49"/>
      <rect x="14" y="120" width="185" height="6" rx="3" fill="#F97316" filter="url(#glow)"/>
    </g>
  </g>
</svg>