<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 300" width="100%" height="300">
  <defs>
    <linearGradient id="mwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#071426"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="mwCyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="scanlineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="mwGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes mwBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes mwScan {
        0% { transform: translateY(-300px); }
        100% { transform: translateY(300px); }
      }
      @keyframes mwPulse {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 0.3; }
      }
      .mw-cursor {
        animation: mwBlink 1s infinite;
      }
      .mw-scanline {
        animation: mwScan 4s linear infinite;
      }
      .mw-pulse {
        animation: mwPulse 2s ease-in-out infinite;
      }
      .mw-font {
        font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, monospace;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="950" height="300" rx="14" fill="url(#mwBg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Top Terminal Window Bar (MikeWall style) -->
  <path d="M 0 14 Q 0 0 14 0 L 936 0 Q 950 0 950 14 L 950 42 L 0 42 Z" fill="#0A0F1D" stroke="#1E293B" stroke-width="1"/>

  <!-- Window Control Buttons (Red, Yellow, Green) -->
  <circle cx="24" cy="21" r="6" fill="#EF4444"/>
  <circle cx="44" cy="21" r="6" fill="#F59E0B"/>
  <circle cx="64" cy="21" r="6" fill="#10B981"/>

  <!-- Window Title -->
  <text x="475" y="26" text-anchor="middle" class="mw-font" font-size="12" fill="#64748B">vinit@forensics-soc:~ (zsh)</text>

  <!-- Cyber Grid Background -->
  <g opacity="0.06" stroke="#00E5FF" stroke-width="1">
    <line x1="0" y1="90" x2="950" y2="90"/>
    <line x1="0" y1="150" x2="950" y2="150"/>
    <line x1="0" y1="210" x2="950" y2="210"/>
    <line x1="0" y1="260" x2="950" y2="260"/>
    <line x1="160" y1="42" x2="160" y2="300"/>
    <line x1="320" y1="42" x2="320" y2="300"/>
    <line x1="480" y1="42" x2="480" y2="300"/>
    <line x1="640" y1="42" x2="640" y2="300"/>
    <line x1="800" y1="42" x2="800" y2="300"/>
  </g>

  <!-- Animated Scanline -->
  <rect x="0" y="42" width="950" height="60" fill="url(#scanlineGrad)" class="mw-scanline" pointer-events="none"/>

  <!-- Terminal Command Prompt -->
  <g transform="translate(35, 76)">
    <text class="mw-font" font-size="13" fill="#10B981">$</text>
    <text x="18" class="mw-font" font-size="13" fill="#38BDF8">./launch_forensics_core.sh</text>
    <text x="255" class="mw-font" font-size="13" fill="#64748B">--mode=autonomous --target=evidence</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(35, 138)">
    <text class="mw-font" font-size="44" font-weight="900" fill="url(#mwCyanPurple)" letter-spacing="3" filter="url(#mwGlow)">VINIT SHAKYA</text>
    <circle cx="365" cy="-14" r="5" fill="#00E5FF" class="mw-pulse"/>
  </g>

  <!-- Sub-headline -->
  <g transform="translate(35, 172)">
    <text class="mw-font" font-size="14" font-weight="600" fill="#E2E8F0" letter-spacing="1.5">
      CYBERSECURITY <tspan fill="#00E5FF">✦</tspan> DIGITAL FORENSICS <tspan fill="#7C3AED">✦</tspan> AI THREAT INTEL
    </text>
  </g>

  <!-- Badges / Tags Row (Mike Wall Style) -->
  <g transform="translate(35, 204)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="130" height="28" rx="6" fill="#071426" stroke="#00E5FF" stroke-width="1"/>
    <circle cx="14" cy="14" r="3.5" fill="#00E5FF"/>
    <text x="26" y="18" class="mw-font" font-size="10.5" font-weight="bold" fill="#00E5FF">DFIR ANALYST</text>

    <!-- Tag 2 -->
    <rect x="142" y="0" width="150" height="28" rx="6" fill="#071426" stroke="#7C3AED" stroke-width="1"/>
    <circle cx="156" cy="14" r="3.5" fill="#7C3AED"/>
    <text x="168" y="18" class="mw-font" font-size="10.5" font-weight="bold" fill="#A855F7">CRYPTO TRACE-X</text>

    <!-- Tag 3 -->
    <rect x="304" y="0" width="140" height="28" rx="6" fill="#071426" stroke="#F97316" stroke-width="1"/>
    <circle cx="318" cy="14" r="3.5" fill="#F97316"/>
    <text x="330" y="18" class="mw-font" font-size="10.5" font-weight="bold" fill="#F97316">OSINT &amp; RECON</text>

    <!-- Tag 4 -->
    <rect x="456" y="0" width="155" height="28" rx="6" fill="#071426" stroke="#10B981" stroke-width="1"/>
    <circle cx="470" cy="14" r="3.5" fill="#10B981"/>
    <text x="482" y="18" class="mw-font" font-size="10.5" font-weight="bold" fill="#10B981">GRAPH AI (NEO4J)</text>

    <!-- Tag 5 -->
    <rect x="623" y="0" width="120" height="28" rx="6" fill="#071426" stroke="#0284C7" stroke-width="1"/>
    <circle cx="637" cy="14" r="3.5" fill="#0284C7"/>
    <text x="649" y="18" class="mw-font" font-size="10.5" font-weight="bold" fill="#38BDF8">KALI LINUX</text>
  </g>

  <!-- Terminal Status Line at Bottom -->
  <g transform="translate(35, 275)">
    <text class="mw-font" font-size="12" fill="#64748B">[SYS_LOG] Core nodes online • Evidence engine: armed •</text>
    <text x="440" class="mw-font" font-size="12" fill="#00E5FF">Clearance: Level-4</text>
    <rect x="585" y="-10" width="8" height="13" fill="#00E5FF" class="mw-cursor"/>
  </g>

  <!-- Right Decorative Cyber Hexagon / HUD -->
  <g transform="translate(795, 85)">
    <polygon points="50,5 90,28 90,75 50,98 10,75 10,28" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.6"/>
    <polygon points="50,15 80,32 80,68 50,85 20,68 20,32" fill="none" stroke="#7C3AED" stroke-width="1" opacity="0.4"/>
    <circle cx="50" cy="51" r="8" fill="#00E5FF" filter="url(#mwGlow)" class="mw-pulse"/>
    <text x="50" y="125" text-anchor="middle" class="mw-font" font-size="9" fill="#00E5FF" letter-spacing="1">SOC_SECURED</text>
  </g>
</svg>